<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mundo Brilhante</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#d8f4ff;color:#49345e}button,input,select{font:inherit}button{border:0;border-radius:13px;background:#fff;color:#553968;padding:10px;box-shadow:0 3px 0 #d6c6e4;cursor:pointer}button:active{transform:translateY(2px)}header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:5px;align-items:center;padding:8px;background:#ffffffdd;flex-wrap:wrap}header b{color:#a441a7;margin-right:auto}header button{font-size:12px;padding:9px 7px}#world{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#9ee5ff 0 57%,#b8e897 57% 100%);touch-action:none}#sun{position:absolute;top:16%;right:12%;font-size:52px}#clouds{position:absolute;top:20%;left:8%;font-size:46px}#scene{position:absolute;bottom:18%;width:100%;display:flex;justify-content:space-around;align-items:flex-end;gap:8px;padding:0 10px} .building{width:29%;height:clamp(140px,34vh,280px);border:5px solid #fff;border-bottom:0;border-radius:22px 22px 0 0;background:#ffb5db;box-shadow:0 8px 0 #bd78a0;text-align:center;position:relative;padding-top:12px;font-size:clamp(13px,3vw,19px);font-weight:bold}.building:nth-child(2){background:#ffd589}.building:nth-child(3){background:#c6b5ff}.building .icon{font-size:clamp(32px,8vw,62px);display:block}.door{position:absolute;bottom:0;left:30%;width:40%;height:38%;background:#fff5f6;border:5px solid #8d5c9c;border-bottom:0;border-radius:50px 50px 0 0}.window{position:absolute;left:8%;top:50%;background:#b5f1ff;border:3px solid white;width:18%;height:18%;border-radius:9px}.road{position:absolute;bottom:0;width:100%;height:18%;background:#85869c;border-top:8px solid #eee}.road:after{content:"";position:absolute;top:50%;width:100%;border-top:5px dashed #fff5b5}.car{position:absolute;bottom:9%;left:8%;font-size:54px;z-index:2;transition:left .2s}.avatar{position:absolute;bottom:15%;left:45%;height:190px;width:115px;z-index:3;transition:left .12s;filter:drop-shadow(0 5px 2px #0002)}.avatar svg{width:100%;height:100%;overflow:visible}.controls{position:absolute;bottom:10px;left:10px;z-index:4;display:flex;gap:5px}.controls button,.actions button{background:#fff7ff}.actions{position:absolute;bottom:10px;right:8px;z-index:4;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:63%}.actions button{font-size:12px;padding:9px 7px}.panel{position:absolute;inset:55px 8px 12px;background:#fff9ff;z-index:10;border:3px solid #e9b3ec;border-radius:22px;padding:15px;overflow:auto;box-shadow:0 0 0 100vmax #0006}.hidden{display:none!important}.panel h2{margin:5px 0 15px}.close{float:right;background:#ffddf3}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid button{background:#f7e9ff;min-height:66px}.field{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}.field select{width:60%;padding:9px;border-radius:10px;border:2px solid #d6b0e7;background:white}.phone{max-width:440px;margin:auto;background:#ebf3ff;border:8px solid #524267;border-radius:35px;min-height:72vh;padding:12px}.app{background:white;padding:14px;border-radius:16px;margin:10px 0}.chatlog{height:220px;overflow:auto;background:#e8f8ec;padding:10px;border-radius:12px}.bubble{background:white;margin:8px 0;padding:8px;border-radius:12px;max-width:90%;overflow-wrap:anywhere}.msg{background:#c8f2c9;margin-left:auto}.row{display:flex;gap:6px}.row input{min-width:0;flex:1;padding:10px;border:2px solid #b7dbbb;border-radius:12px}.video{height:230px;border-radius:15px;background:linear-gradient(140deg,#ffb1df,#8fd8fa);display:flex;align-items:center;justify-content:center;font-size:95px;animation:bop 1s infinite alternate}@keyframes bop{to{transform:scale(.96) rotate(2deg)}}#status{position:absolute;top:68px;left:10px;z-index:4;background:#fff9;border-radius:12px;padding:6px 10px;font-size:12px}#notice{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);z-index:8;background:#fff;padding:8px 15px;border-radius:14px;display:none;text-align:center} @media(max-width:430px){.avatar{height:160px;width:100px}.building{height:32vh}.actions{bottom:8px;max-width:65%}.controls button{padding:9px 12px}header b{width:100%}#status{top:100px}}

.building{color:inherit;font-family:inherit;cursor:pointer}.controls button{min-width:44px;min-height:44px}.actions button{min-height:44px}@media(max-width:430px){.actions{max-width:calc(100% - 122px);gap:4px}.actions button{font-size:11px;padding:8px 5px}.panel{inset:105px 8px 12px}.phone{padding:8px;border-width:5px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div id="world"><div id="sun">☀️</div><div id="clouds">☁️ ☁️</div><div id="scene"></div><div class="road"></div><div id="car" class="car">🚗</div><div id="avatar" class="avatar"></div><div id="status">🏙️ Cidade das Flores • toque nos prédios!</div><div id="notice"></div></div><header><b>✨ Mundo Brilhante</b><button onclick="openPanel('creator')">👗 Criar</button><button onclick="openPanel('phone')">📱 Celular</button><button onclick="openPanel('map')">🗺️ Mapa</button><button onclick="save()">💾 Salvar</button></header><div class="controls"><button onclick="walk(-1)">◀</button><button onclick="walk(1)">▶</button></div><div class="actions"><button onclick="action('dance')">💃 Dançar</button><button onclick="action('wave')">👋 Acenar</button><button onclick="action('film')">🎥 Filmar</button><button onclick="action('car')">🚗 Carro</button><button onclick="action('enter')">🚪 Entrar</button></div><div id="panel" class="panel hidden"></div><script>
'use strict';
const places=[['🏠','Casa','home'],['🏫','Escola','school'],['🛍️','Shopping','mall'],['💇','Salão','salon'],['🍰','Café','cafe'],['🏥','Hospital','hospital'],['🎡','Parque','park'],['🏖️','Praia','beach'],['🎬','Estúdio','studio']];
let area=0,pos=45,inside=false,driving=false,pose='';let person={skin:'#dca27d',hair:'#6b3e32',style:'Longo',eyes:'#704e9e',top:'#ff70b5',bottom:'#8a6bd3',outfit:'Vestido',shoes:'#ffffff',name:'Luna'};let messages=['Oi! Vamos brincar? 💕'];let videos=0;try{const s=JSON.parse(localStorage.getItem('mundo-brilhante-v3'));if(s){person={...person,...s.person};messages=Array.isArray(s.messages)?s.messages.filter(m=>typeof m==='string'):messages;videos=Number.isFinite(s.videos)&&s.videos>=0?s.videos:0}}catch(e){}
function save(){try{localStorage.setItem('mundo-brilhante-v3',JSON.stringify({person,messages,videos}));notify('💾 Progresso salvo neste navegador!')}catch(e){notify('Não foi possível salvar neste navegador')}}
function notify(s){let e=document.getElementById('notice');e.textContent=s;e.style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>e.style.display='none',2300)}
function character(){const p=person;const long=p.style==='Longo'||p.style==='Tranças';const dress=p.outfit==='Vestido';const skirt=p.outfit==='Saia';const pants=p.outfit==='Calça';document.getElementById('avatar').innerHTML=`<svg viewBox="0 0 120 210" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="204" rx="35" ry="5" fill="#0002"/><path d="M37 137 L33 192 L47 192 L58 143 M65 143 L74 192 L88 192 L83 137" fill="${p.skin}" stroke="#8b5c5c" stroke-width="2"/><path d="M30 190 h24 v11 H27 Q23 195 30 190 M69 190 h24 q8 7 0 11 H69Z" fill="${p.shoes}" stroke="#a99"/><path d="M38 88 L18 137 Q13 148 21 151 Q30 151 32 140 L48 111 M78 88 L100 137 Q107 148 99 151 Q91 151 88 140 L70 111" fill="${p.skin}" stroke="#8b5c5c" stroke-width="2"/><path d="M40 83 Q60 75 80 83 L88 140 H31Z" fill="${p.top}" stroke="#a75b96" stroke-width="2"/>${dress?`<path d="M37 111 L83 111 L101 157 H20Z" fill="${p.top}" stroke="#a75b96" stroke-width="2"/>`:skirt?`<path d="M35 128 H85 L98 157 H22Z" fill="${p.bottom}"/>`:`<path d="M32 130 H88 L84 ${pants?190:159} H62 L59 143 L55 ${pants?190:159} H36Z" fill="${p.bottom}"/>`}<path d="M29 46 Q25 8 60 9 Q99 7 93 48 L95 ${long?109:66} H25 L27 55Z" fill="${p.hair}"/><ellipse cx="60" cy="52" rx="33" ry="37" fill="${p.skin}"/><path d="M28 43 Q31 5 61 13 Q92 12 92 43 Q78 35 70 26 Q53 43 28 43" fill="${p.hair}"/><ellipse cx="48" cy="56" rx="6" ry="8" fill="white"/><ellipse cx="73" cy="56" rx="6" ry="8" fill="white"/><circle cx="49" cy="57" r="4" fill="${p.eyes}"/><circle cx="72" cy="57" r="4" fill="${p.eyes}"/><circle cx="50" cy="55" r="1.5" fill="white"/><circle cx="73" cy="55" r="1.5" fill="white"/><path d="M53 73 Q60 80 68 73" fill="none" stroke="#b54e6d" stroke-width="3" stroke-linecap="round"/><circle cx="37" cy="70" r="5" fill="#ff9cab88"/><circle cx="84" cy="70" r="5" fill="#ff9cab88"/>${p.style==='Tranças'?`<path d="M30 60 L25 110 M90 60 L95 110" stroke="${p.hair}" stroke-width="13" stroke-dasharray="8 2" stroke-linecap="round"/>`:''}${p.style==='Coques'?`<circle cx="25" cy="25" r="14" fill="${p.hair}"/><circle cx="95" cy="25" r="14" fill="${p.hair}"/>`:''}${p.style==='Rabo de cavalo'?`<path d="M91 27 Q125 20 106 79" fill="none" stroke="${p.hair}" stroke-width="16"/>`:''}${pose==='film'?'<text x="86" y="125" font-size="28">📱</text>':''}</svg>`;document.getElementById('avatar').style.left=pos+'%'}
function scene(){const items=inside?[['🛋️','Sala'],['🪴','Decoração'],['🧸','Brinquedos']]:places.slice(area,area+3);document.getElementById('scene').innerHTML=items.map((a,i)=>`<button class="building" onclick="building(${i})"><span class="icon">${a[0]}</span>${a[1]}<span class="window"></span><span class="door"></span></button>`).join('');document.getElementById('status').textContent=(inside?'🏠 Dentro de '+places[area][1]:'🏙️ '+places[area][1]+' e arredores')+' • toque nos prédios!';document.getElementById('world').style.background=inside?'linear-gradient(#f9d8ff 0 65%,#e6bba1 65%)':'linear-gradient(#9ee5ff 0 57%,#b8e897 57% 100%)';character()}
function building(i){if(inside){notify(['🛋️ Você sentou no sofá!','🌷 Você decorou a sala!','🧸 Você pegou um brinquedo!'][i]);return}let idx=Math.min(area+i,places.length-1);area=idx;inside=true;scene();notify('🚪 Entrou em '+places[idx][1])}
function walk(d){pos=Math.min(82,Math.max(8,pos+d*9));character();if(pos>=82){pos=20;area=Math.min(6,Math.floor(area/3)*3+3);scene()}if(pos<=8){pos=70;area=Math.max(0,Math.floor(area/3)*3-3);scene()}}
function action(a){pose=a;if(a==='car'){driving=!driving;document.getElementById('car').style.left=driving?'45%':'8%';notify(driving?'🚗 Entrou no carro!':'🚗 Saiu do carro!')}else if(a==='enter'){inside=!inside;scene();notify(inside?'🚪 Você entrou!':'🌳 Você saiu para a cidade!')}else{notify(({dance:'💃 Dançando!',wave:'👋 Acenando!',film:'🎥 Filmando uma amiga!'})[a]);document.getElementById('avatar').animate(a==='dance'?[{transform:'rotate(-12deg)'},{transform:'rotate(12deg)'},{transform:'rotate(-12deg)'}]:[{transform:'translateY(0)'},{transform:'translateY(-15px)'},{transform:'translateY(0)'}],{duration:550,iterations:3});character()}}
function openPanel(which){const e=document.getElementById('panel');e.classList.remove('hidden');e.innerHTML='<button class="close" onclick="closePanel()">✖ Fechar</button><div id="panelBody"></div>';if(which==='creator')creator();if(which==='phone')phone();if(which==='map')map()}
function closePanel(){document.getElementById('panel').classList.add('hidden')}
function creator(){let fields=[['name','Nome',['Luna','Sofia','Bela','Estrela','Liz']],['skin','Cor da pele',['#f5d6b6','#e8bb91','#dca27d','#aa7255','#754a39','#50342c']],['hair','Cor do cabelo',['#6b3e32','#17151c','#b77a39','#f1ce64','#f48ab6','#b36bd7','#fafafa']],['style','Penteado',['Longo','Curto','Coques','Rabo de cavalo','Tranças']],['eyes','Olhos',['#704e9e','#654633','#3d9a70','#3d7ec7','#1e1b24']],['outfit','Roupa',['Vestido','Blusa e shorts','Saia','Calça']],['top','Cor da blusa/vestido',['#ff70b5','#e95d66','#a37bea','#66c7ea','#f2d264','#a6d98d']],['bottom','Cor de shorts/saia/calça',['#8a6bd3','#6b9de0','#fa9db6','#3b506b','#fff1b9']],['shoes','Sapatos',['#ffffff','#23232b','#ff9bcb','#f2c96d']]];document.getElementById('panelBody').innerHTML='<h2>👗 Criador de personagens</h2><p>Escolha as roupas, cabelos e cores. Veja as mudanças na personagem!</p>'+fields.map(([k,label,options])=>`<label class="field">${label}<select data-field="${k}">${options.map(o=>`<option value="${o}" ${person[k]===o?'selected':''}>${o.startsWith('#')?'● '+o:o}</option>`).join('')}</select></label>`).join('')+'<button onclick="save();closePanel()">💖 Pronto!</button>';document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{person[el.dataset.field]=el.value;character();save()})}
function map(){document.getElementById('panelBody').innerHTML='<h2>🗺️ Escolha um lugar da cidade</h2><div class="grid">'+places.map((p,i)=>`<button onclick="area=${Math.min(6,Math.floor(i/3)*3)};inside=false;pos=45;scene();closePanel();notify('📍 ${p[1]}')">${p[0]}<br>${p[1]}</button>`).join('')+'</div>'}
const apps=[['💚','WhatsApp','chat'],['🎵','TikTok','tiktok'],['📸','Câmera','camera'],['🖼️','Galeria','gallery'],['🎧','Música','music'],['👗','Moda','fashion'],['💄','Maquiagem','makeup'],['🎮','Jogos','games'],['🗺️','Mapa','map'],['📖','Diário','diary'],['🛍️','Loja','shop'],['📅','Agenda','agenda'],['🎨','Desenhar','draw'],['🌤️','Clima','weather']];
function phone(){document.getElementById('panelBody').innerHTML='<div class="phone"><h2>📱 Meu celular</h2><div id="appBody"><div class="grid">'+apps.map(a=>`<button onclick="app('${a[2]}')">${a[0]}<br>${a[1]}</button>`).join('')+'</div></div></div>'}
function app(id){const a=apps.find(x=>x[2]===id);let el=document.getElementById('appBody');el.innerHTML=`<button onclick="phone()">⬅ Aplicativos</button><h3>${a[0]} ${a[1]}</h3><div id="appContent" class="app"></div>`;let c=document.getElementById('appContent');if(id==='chat'){c.innerHTML='<p>Conversa fictícia com Sofia 💚</p><div class="chatlog" id="chatlog"></div><div class="row"><input id="message" placeholder="Escreva aqui..."><button onclick="sendMsg()">Enviar</button></div>';renderChat()}else if(id==='tiktok'){c.innerHTML='<div class="video" id="video">💃</div><p>Vídeos fictícios das personagens • seus vídeos: <b id="count">'+videos+'</b></p><button onclick="nextVideo()">▶ Próximo</button> <button onclick="notify(\'❤️ Curtido!\')">❤️ Curtir</button> <button onclick="videos++;document.getElementById(\'count\').textContent=videos;save();notify(\'🎥 Dancinha criada!\')">🎥 Gravar</button>'}else if(id==='fashion'||id==='makeup'){c.innerHTML='<p>Experimente roupas e penteados!</p><button onclick="openPanel(\'creator\')">👗 Criar visual</button>'}else if(id==='map'){c.innerHTML='<button onclick="openPanel(\'map\')">🗺️ Explorar cidade</button>'}else if(id==='camera'||id==='gallery'){c.innerHTML='<div class="video">📸</div><button onclick="notify(\'📸 Foto de brincadeira tirada!\')">📷 Tirar foto</button>'}else if(id==='music'){c.innerHTML='<p>Toque nas notas para ouvir!</p>'+[262,330,392,523].map(f=>`<button onclick="beep(${f})">🎵</button>`).join('')}else if(id==='diary'||id==='agenda'){c.innerHTML='<p>Escreva suas ideias:</p><textarea id="notes" style="width:100%;height:170px;border-radius:12px;padding:10px"></textarea><button onclick="saveNotes()">Guardar</button>';try{document.getElementById('notes').value=localStorage.getItem('brilhante-notes')||''}catch(e){notify('Armazenamento indisponível neste navegador')}}else if(id==='draw'){c.innerHTML='<p>Desenhe com o dedo!</p><canvas id="draw" width="300" height="250" style="width:100%;background:white;touch-action:none;border:2px solid pink"></canvas><button onclick="document.getElementById(\'draw\').getContext(\'2d\').clearRect(0,0,300,250)">Apagar</button>';let cv=document.getElementById('draw'),g=cv.getContext('2d'),on=false;cv.onpointerdown=e=>{on=true;cv.setPointerCapture(e.pointerId);g.beginPath();let r=cv.getBoundingClientRect();g.moveTo((e.clientX-r.left)*300/r.width,(e.clientY-r.top)*250/r.height)};cv.onpointermove=e=>{if(!on)return;let r=cv.getBoundingClientRect();g.lineTo((e.clientX-r.left)*300/r.width,(e.clientY-r.top)*250/r.height);g.strokeStyle='#c65da4';g.lineWidth=5;g.stroke()};cv.onpointerup=cv.onpointercancel=cv.onlostpointercapture=()=>on=false}else{c.innerHTML='<p>✨ Bem-vinda! Este aplicativo está em construção.</p><button onclick="notify(\'✨ Que divertido!\')">Experimentar</button>'}}
function saveNotes(){try{localStorage.setItem('brilhante-notes',document.getElementById('notes').value);notify('💾 Salvo!')}catch(e){notify('Não foi possível salvar neste navegador')}}
function renderChat(){document.getElementById('chatlog').innerHTML=messages.map((m,i)=>`<div class="bubble ${i?'msg':''}"></div>`).join('');document.querySelectorAll('.bubble').forEach((e,i)=>e.textContent=messages[i])}function sendMsg(){let i=document.getElementById('message'),v=i.value.trim();if(!v)return;messages.push(v);i.value='';renderChat();save()}function nextVideo(){document.getElementById('video').textContent=['💃','🎤','🦄','👯','🎨','🐶'][Math.random()*6|0]}function beep(f){try{let ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);o.start();o.stop(ac.currentTime+.26)}catch(e){}}
window.addEventListener('keydown',e=>{if(!document.getElementById('panel').classList.contains('hidden')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight')e.preventDefault();if(e.key==='ArrowLeft')walk(-1);if(e.key==='ArrowRight')walk(1)});scene();
</script></body></html>
