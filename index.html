<script>
(()=>{'use strict';const cv=document.querySelector('#game'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1,spots=[],move={x:0,y:0},frame=0,anim=0,scene='street',room='home',held='',modalOpen=false;const $=id=>document.getElementById(id);const places=[{id:'home',name:'Minha Casa',icon:'🏡',color:'#f8b6d8'},{id:'cafe',name:'Café Doce',icon:'🧁',color:'#fbd08c'},{id:'school',name:'Escola',icon:'🎒',color:'#b9b0f8'},{id:'shop',name:'Loja de Moda',icon:'👗',color:'#f8b7aa'},{id:'studio',name:'Estúdio',icon:'🎤',color:'#a6d7f7'},{id:'park',name:'Parque',icon:'🌳',color:'#b8dfad'}];const defaultAvatar={skin:'#e8ad85',hair:'#6e3d34',outfit:'#d36da9',pants:'#8455a9',style:0,dress:true};let speed=1,subroom=false,roomParent='home';let gesture='normal',gestureUntil=0;let avatar={...defaultAvatar},pos={x:0.5,y:.77},street=0,car=false,inventory=[],messages=[],likes=0,posts=0,weather=0,score=0;try{const x=JSON.parse(localStorage.getItem('mb_village_v1')||'{}');avatar={...avatar,...x.avatar};inventory=x.inventory||[];messages=x.messages||[];likes=x.likes||0;posts=x.posts||0;score=x.score||0;speed=[.5,1,1.6].includes(x.speed)?x.speed:1;weather=[0,1,2,3].includes(x.weather)?x.weather:0}catch(e){}function save(){try{localStorage.setItem('mb_village_v1',JSON.stringify({avatar,inventory,messages,likes,posts,score,speed,weather}))}catch(e){}}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const rect=(x,y,w,h,c,r=0)=>{ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()};const line=(x,y,x2,y2,c,w=2)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()};function text(t,x,y,size=20,color='#654a70',align='center'){ctx.font=`700 ${size}px system-ui`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function box(x,y,w,h,fill,depth=12){rect(x+depth,y+depth,w,h,'#76577b44',12);rect(x,y,w,h,fill,12);line(x,y+h,x+depth,y+h+depth,'#ffffff99',3)}function character(x,y,scale=1,action=0){ctx.save();ctx.translate(x+(gesture==='medo'?Math.sin(frame)*2:0),y);ctx.scale(scale,scale);ellipse(0,5,28,9,'#705c7350');const wob=action?Math.sin(frame/7)*5:Math.sin(frame/35)*1;ctx.translate(0,wob);line(-12,-40,-14,0,'#67456b',11);line(12,-40,14,0,'#67456b',11);ellipse(-14,0,8,5,'#fff');ellipse(14,0,8,5,'#fff');rect(-25,-91,50,59,avatar.dress?avatar.outfit:avatar.pants,16);if(!avatar.dress){rect(-25,-90,50,26,avatar.outfit,12)}line(-23,-78,-36,-48,avatar.skin,12);line(23,-78,36,-48,avatar.skin,12);if(action||gesture==='acenar'){line(23,-78,37+Math.sin(frame/6)*9,-113,avatar.skin,12)}if(gesture==='conversar'){line(-23,-78,-39+Math.sin(frame/8)*7,-91,avatar.skin,11)}if(gesture==='medo'){line(-23,-78,-30,-108,avatar.skin,11);line(23,-78,30,-108,avatar.skin,11)}ellipse(0,-127,35,41,avatar.hair);ellipse(0,-117,30,34,avatar.skin);if(avatar.style===1){ellipse(-30,-144,14,17,avatar.hair);ellipse(30,-144,14,17,avatar.hair)}if(avatar.style===2){rect(-37,-130,11,50,avatar.hair,6);rect(26,-130,11,50,avatar.hair,6)}if(avatar.style===3){ellipse(24,-155,18,18,avatar.hair)}const eyeY=gesture==='triste'?-117:-120,eyeR=gesture==='medo'?7:gesture==='nojo'?3:6;ellipse(-11,eyeY,4,eyeR,'#413249');ellipse(11,eyeY,4,eyeR,'#413249');if(gesture==='bravo'){line(-19,-135,-7,-129,'#53364e',3);line(7,-129,19,-135,'#53364e',3)}ellipse(-12,-122,1.7,2,'#fff');ellipse(10,-122,1.7,2,'#fff');ellipse(-24,-110,7,4,avatar.blush||'#f39eaf88');ellipse(24,-110,7,4,avatar.blush||'#f39eaf88');if(avatar.shadow){line(-17,-128,-6,-128,avatar.shadow,4);line(6,-128,17,-128,avatar.shadow,4)}ctx.strokeStyle=avatar.lip||'#9d4e73';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-109,gesture==='medo'?7:7,gesture==='triste'?Math.PI:0,gesture==='triste'?Math.PI*2:Math.PI);ctx.stroke();if(gesture==='conversar') {ellipse(0,-106,5,3+Math.sin(frame/5)*2,avatar.lip||'#9d4e73');text('💬',43,-155,25)}if(gesture==='medo')ellipse(0,-108,5,8,'#7f4066');if(gesture==='nojo'){line(-6,-107,4,-110,'#7f4066',3);text('🤢',40,-150,24)};if(gesture==='rir')text('😂',38,-150,24);if(gesture==='dormir')text('💤',38,-150,24);if(gesture==='surpreso')text('❗',37,-157,24);if(gesture==='comemorar')text('🎉',37,-157,24);if(held)text(held,38,-75,24);if(car){text('🚗',0,-22,65)}ctx.restore()}function sky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,weather===1?'#9aa9ca':weather===2?'#c6cedd':'#9fe2ff');g.addColorStop(.7,'#e5f8ff');g.addColorStop(1,'#f5e9fb');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);text(['☀️','🌧️','☁️','🌈'][weather],W*.84,H*.18,55);text('☁️',W*.18,H*.19,48);text('☁️',W*.55,H*.13,38)}function addSpot(x,y,w,h,label,fn){spots.push({x,y,w,h,label,fn})}function streetDraw(){sky();rect(0,H*.56,W,H*.44,'#a7d999');rect(0,H*.82,W,H*.18,'#8c8c9b');for(let x=0;x<W;x+=90)rect(x,H*.91,45,5,'#fff3c8',2);const indices=[street*3,street*3+1,street*3+2];indices.forEach((id,i)=>{const p=places[id%places.length];let bw=Math.min(W*.285,175),bh=Math.min(H*.34,245),x=W*(.055+i*.33),y=H*.59-bh;box(x,y,bw,bh,p.color,9);rect(x+10,y+14,bw-20,35,'#ffffffb9',9);text(p.icon,x+bw/2,y+42,25);text(p.name,x+bw/2,y+64,Math.max(11,Math.min(15,W/30)));for(let j=0;j<2;j++)rect(x+15+j*(bw-45),y+bh*.42,30,35,'#a2eafa',8);rect(x+bw*.35,y+bh*.66,bw*.3,bh*.34,'#f9f2ff',12);text('🚪',x+bw/2,y+bh*.87,29);addSpot(x,y,bw,bh,p.name,()=>enter(p.id))});character(W*pos.x,H*pos.y,Math.min(1.05,W/400),anim>0);text('Toque nas casas para entrar • setas para passear',W/2,H*.64,Math.min(13,W/29),'#705c78');text('🌷',W*.07,H*.76,35);text('🌸',W*.88,H*.76,35)}const roomData={home:{title:'Minha Casa',wall:'#ffe2ed',floor:'#eec6a2',items:[['🛋️','Sofá','sentar'],['🧸','Ursinho','pegar'],['📺','Televisão','ligar'],['🍎','Maçã','pegar'],['🛏️','Quarto','porta']]},cafe:{title:'Café Doce',wall:'#fff0cf',floor:'#d9ad8c',items:[['🧁','Cupcake','pegar'],['🥤','Suco','pegar'],['☕','Café','pegar'],['🪑','Mesa','sentar'],['🚪','Cozinha','porta']]},school:{title:'Escola',wall:'#dfe3ff',floor:'#d6c9a2',items:[['📚','Livros','pegar'],['✏️','Lápis','pegar'],['🎒','Mochila','pegar'],['🪑','Carteira','sentar'],['🚪','Biblioteca','porta']]},shop:{title:'Loja de Moda',wall:'#ffe3e0',floor:'#f0c9d6',items:[['👗','Vestido','pegar'],['👒','Chapéu','pegar'],['👜','Bolsa','pegar'],['👟','Tênis','pegar'],['🚪','Provador','porta']]},studio:{title:'Estúdio',wall:'#d7f0ff',floor:'#c9b5dc',items:[['🎤','Microfone','pegar'],['📱','Celular','pegar'],['🎥','Câmera','pegar'],['💡','Luz','ligar'],['🚪','Camarim','porta']]},park:{title:'Parque',wall:'#c7f4d3',floor:'#99cb87',items:[['🛝','Escorregador','brincar'],['⚽','Bola','pegar'],['🧺','Piquenique','sentar'],['🌼','Flor','pegar'],['🚪','Jardim','porta']]}};function roomDraw(){const r=roomData[room];rect(0,0,W,H,r.wall);rect(0,H*.65,W,H*.35,r.floor);rect(0,H*.62,W,12,'#ffffff');rect(0,0,12,H,'#ffffff77');rect(W-12,0,12,H,'#ffffff77');text('✨ '+r.title, W/2,H*.16,Math.min(27,W/14));const ww=Math.min(W*.25,120);box(W*.07,H*.25,ww,H*.25,'#bdefff');line(W*.07+ww/2,H*.25,W*.07+ww/2,H*.5,'#fff',5);line(W*.07,H*.38,W*.07+ww,H*.38,'#fff',5);const count=r.items.length,iw=Math.min(W*.175,100),gap=(W-count*iw)/(count+1);r.items.forEach((it,i)=>{const x=gap+(iw+gap)*i,y=H*.43;box(x,y,iw,Math.min(100,H*.17),'#ffffffb8',9);text(it[0],x+iw/2,y+49,Math.min(35,iw*.44));text(it[1],x+iw/2,y+70,Math.min(12,iw/7));addSpot(x,y,iw,105,it[1],()=>interactItem(it))});character(W*pos.x,H*pos.y,Math.min(1,W/410),anim>0);rect(W*.02,H*.2,80,42,'#ffffffcf',10);text('🚪 Sair',W*.02+40,H*.2+27,15);addSpot(W*.02,H*.2,80,42,'Sair',()=>exitRoom());text('Toque nos objetos • toque em uma porta para abrir',W/2,H*.60,Math.min(12,W/32),'#6e5076')}function draw(){frame++;spots=[];if(scene==='street')streetDraw();else roomDraw();if(anim>0)anim--;if(gestureUntil&&Date.now()>gestureUntil){gesture='normal';gestureUntil=0}requestAnimationFrame(draw)}requestAnimationFrame(draw);function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}function enter(id){car=false;gesture='normal';scene='room';room=id;pos={x:.5,y:.8};held='';toast('Você entrou em '+roomData[id].title+'! 🚪');updateActions()}function exitRoom(){if(subroom){room=roomParent;subroom=false;updateActions();toast('De volta à sala principal!');return}scene='street';pos={x:.5,y:.77};held='';updateActions();toast('De volta à Village! 🏘️')}function interactItem(it){const [icon,name,kind]=it;if(kind==='porta'){roomParent=room;const key=room+'_extra';if(!roomData[key])roomData[key]={title:name,wall:roomData[room].wall,floor:roomData[room].floor,items:({home:[['🛏️','Cama','sentar'],['🧸','Coelhinho','pegar'],['📔','Livro','pegar'],['💡','Abajur','ligar']],cafe:[['🍓','Morango','pegar'],['🥣','Tigela','pegar'],['🍪','Biscoito','pegar']],school:[['📖','Conto de fadas','pegar'],['🧩','Quebra-cabeça','pegar'],['🪑','Poltrona','sentar']],shop:[['🎀','Laço','pegar'],['🪞','Espelho','ligar'],['👑','Tiara','pegar']],studio:[['💄','Batom','pegar'],['🎭','Máscara','pegar'],['🪑','Cadeira','sentar']],park:[['🌻','Girassol','pegar'],['🦋','Borboleta','brincar'],['🍐','Pera','pegar']]})[roomParent]};room=key;subroom=true;pos={x:.5,y:.8};updateActions();toast('Você entrou no '+name+'!');return}if(kind==='pegar'){held=icon;if(!inventory.includes(name))inventory.push(name);save();toast('Você pegou '+name+' '+icon)}else if(kind==='sentar'){anim=80;toast('A personagem se sentou! 🪑')}else if(kind==='ligar'){toast(name+' ligado! 🔊');beep()}else{anim=80;toast('Hora de brincar! '+icon);beep()}}function updateActions(){const a=$('insideActions');a.innerHTML=scene==='room'?'<button id="leave">🚪 Voltar / sair</button><button id="bag">🎒 Mochila</button><button id="drop">✋ Soltar</button>':'<button id="next">➡️ Outra rua</button><button id="drive">🚗 Dirigir function app(i){if(i===12){makeup();return}if(i===11){calendar();return}const name=apps[i][1];if(i===0){openPanel('💬 Conversas',`<p>Conversa com a amiga Luna (personagem fictícia)</p><div id="chat" class="chat"></div><div class="row"><input id="msg" placeholder="Escreva sua mensagem..." maxlength="200"><button id="send">Enviar 💌</button></div>`);const render=()=>{$('chat').innerHTML=messages.map(m=>`<div class="bubble ${m.from==='Luna'?'other':''}"></div>`).join('');[...$('chat').children].forEach((b,j)=>b.textContent=(messages[j].from==='Luna'?'Luna: ':'Você: ')+messages[j].text);$('chat').scrollTop=99999};render();$('send').onclick=()=>{let v=$('msg').value.trim();if(!v)return;messages.push({from:'Você',text:v},{from:'Luna',text:lunaReply(v,messages)});save();$('msg').value='';render();beep()};$('msg').onkeydown=e=>{if(e.key==='Enter')$('send').click()}}else if(i===1){openPanel('🎵 MiniTok — vídeos do jogo',`<div class="card" style="text-align:center"><div id="vid" style="font-size:72px;height:125px;padding:15px">💃🎶</div><b>Vídeos animados da Village</b><p id="vidname">Dancinha da Luna</p><div class="row"><button id="watch">▶ Próximo vídeo</button><button id="like">💗 Curtir (${likes})</button><button id="post">🎥 Gravar dança (${posts})</button></div></div><p class="mini">Os vídeos são animações de brincadeira, não vídeos enviados por pessoas reais.</p>`);let n=0;const vs=['💃🎶','🕺✨','🎤🎵','👯‍♀️💖'];$('watch').onclick=()=>{n++;$('vid').textContent=vs[n%vs.length];$('vidname').textContent=['Dancinha da Luna','Dança da Estrela','Show na escola','Amigas dançando'][n%4];beep()};$('like').onclick=()=>{likes++;save();$('like').textContent='💗 Curtir ('+likes+')'};$('post').onclick=()=>{posts++;save();toast('Dancinha salva no MiniTok! 🎥');$('post').textContent='🎥 Gravar dança ('+posts+')'}}else if(i===2){weatherApp()}else if(i===3){gamesApp()}else if(i===4){openPanel('📷 Câmera',`<div class="card" style="text-align:center"><div style="font-size:65px">📸 👧 🌈</div><p>Fotografe sua personagem!</p><button id="snap">📸 Tirar foto</button></div><div id="gallery"></div>`);$('snap').onclick=()=>{const x=document.createElement('div');x.className='shot';x.textContent='📸 Foto da Village '+new Date().toLocaleTimeString('pt-BR');$('gallery').prepend(x);beep()}}else if(i===5){openPanel('🎨 Desenho',`<p>Desenhe com o dedo!</p><canvas id="paint" width="320" height="240" style="width:100%;max-width:450px;background:white;border:2px solid #dda5e8;border-radius:15px;touch-action:none"></canvas><div class="row"><input type="color" id="paintColor" value="#c868bc"><button id="erase">🧽 Limpar</button><button id="savePaint">💾 Salvar</button><button id="downloadPaint">🖼️ Baixar</button></div>`);let c=$('paint'),g=c.getContext('2d'),down=false;try{const data=localStorage.getItem('mb_village_paint');if(data){const im=new Image();im.onload=()=>g.drawImage(im,0,0,c.width,c.height);im.src=data}}catch(e){}const pt=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let [x,y]=pt(e);g.beginPath();g.moveTo(x,y)};c.onpointermove=e=>{if(!down)return;let[x,y]=pt(e);g.strokeStyle=$('paintColor').value;g.lineWidth=5;g.lineCap='round';g.lineTo(x,y);g.stroke()};c.onpointerup=()=>down=false;$('erase').onclick=()=>{g.clearRect(0,0,c.width,c.height);localStorage.removeItem('mb_village_paint')};$('savePaint').onclick=()=>{try{localStorage.setItem('mb_village_paint',c.toDataURL());toast('Desenho salvo! 🎨')}catch(e){toast('Não foi possível salvar')}};$('downloadPaint').onclick=()=>{const a=document.createElement('a');a.download='mundo-brilhante-desenho.png';a.href=c.toDataURL();a.click()}}else if(i===6){dress()}else if(i===7){openPanel('🎶 Estúdio de Música',`<p>Toque nas notas, grave uma melodia e ouça depois!</p><div class="row">${['Dó','Ré','Mi','Fá','Sol','Lá','Si','Dó agudo'].map((name,j)=>`<button data-note="${j}" style="min-height:72px">🎹<br>${name}</button>`).join('')}</div><div class="card">🎵 <span id="musicStatus"></span></div><div class="row"><button id="musicRec">🔴 Gravar</button><button id="musicPlay">▶ Ouvir</button><button id="musicClear">🗑️ Apagar</button></div>`);let recording=false,melody=[];try{melody=JSON.parse(localStorage.getItem('mb_village_melody')||'[]')}catch(e){}const notes=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];function note(j){try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=notes[j];g.gain.value=.07;o.start();o.stop(ac.currentTime+.3);o.onended=()=>ac.close()}catch(e){}}const status=()=>{$('musicStatus').textContent=melody.length?melody.length+' notas salvas':'Nenhuma nota gravada'};status();document.querySelectorAll('[data-note]').forEach(el=>el.onclick=()=>{const j=+el.dataset.note;note(j);if(recording){melody.push(j);localStorage.setItem('mb_village_melody',JSON.stringify(melody));status()}});$('musicRec').onclick=()=>{recording=!recording;$('musicRec').textContent=recording?'⏹ Parar':'🔴 Gravar';toast(recording?'Toque nas notas para gravar!':'Melodia salva!')};$('musicPlay').onclick=()=>{if(!melody.length)return toast('Grave sua música primeiro!');melody.forEach((j,k)=>setTimeout(()=>note(j),390*k));toast('Tocando sua música! 🎶')};$('musicClear').onclick=()=>{melody=[];localStorage.removeItem('mb_village_melody');status()}}else if(i===8){openPanel('📔 Meu diário',`<p>Escreva sua história!</p><textarea id="diary" style="width:100%;height:180px;border-radius:12px;padding:10px"></textarea><button id="diarySave">💾 Guardar</button>`);$('diary').value=localStorage.getItem('mb_diary')||'';$('diarySave').onclick=()=>{localStorage.setItem('mb_diary',$('diary').value);toast('Diário salvo!')}}else if(i===9){$('mapBtn').click()}else if(i===10){openPanel('🛍️ Loja',`<p>Escolha um presente para a mochila:</p><div class="appgrid">${['🎀 Laço','🧸 Pelúcia','🎁 Presente','👜 Bolsa','👒 Chapéu','🍭 Pirulito'].map((x,j)=>`<button data-gift="${j}">${x}</button>`).join('')}</div>`);document.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{inventory.push(b.textContent.trim());save();toast('Presente guardado! 🎁')})}else{openPanel('📅 Agenda',`<div class="card"><b>Hoje na Village</b><p>🌞 Passear pela cidade</p><p>🎂 Visitar o Café Doce</p><p>💃 Dançar no estúdio</p><p>🧸 Decorar e brincar em casa</p></div>`)}}function weatherApp(){let opts=[['☀️','Ensolarado','#ffdb89'],['🌧️','Chuvoso','#bed8f6'],['⛅','Nublado','#e6e8f2'],['🌈','Arco-íris','#d3f3d5']];openPanel('🌤️ Clima da Village',`<div class="card" style="text-align:center;background:${opts[weather][2]}"><div style="font-size:75px" id="weatherIcon">${opts[weather][0]}</div><h2 id="weatherName">${opts[weather][1]}</h2><p>Previsão imaginária do nosso jogo</p></div><div class="row">${opts.map((o,j)=>`<button data-weather="${j}">${o[0]} ${o[1]}</button>`).join('')}</div><p>Escolha o clima para brincar de imaginar como está o dia!</p>`);document.querySelectorAll('[data-weather]').forEach(b=>b.onclick=()=>{weather=+b.dataset.weather;$('weatherIcon').textContent=opts[weather][0];$('weatherName').textContent=opts[weather][1];save();beep()})}function gamesApp(){openPanel('🎮 Jogos — Pegue as estrelas',`<p>Toque na estrela para ganhar pontos!</p><div class="card">⭐ Pontos: <b id="score">${score}</b> <button id="restart">Recomeçar</button></div><canvas id="gameapp" width="330" height="200"></canvas>`);const c=$('gameapp'),g=c.getContext('2d');let star={x:160,y:95};function drawMini(){g.fillStyle='#d8f7ff';g.fillRect(0,0,330,200);g.fillStyle='#8fdbab';g.fillRect(0,150,330,50);g.font='48px system-ui';g.textAlign='center';g.fillText('⭐',star.x,star.y)}drawMini();c.onpointerdown=e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*330/r.width,y=(e.clientY-r.top)*200/r.height;if(Math.abs(x-star.x)<40&&Math.abs(y-(star.y-20))<42){score++;$('score').textContent=score;star={x:35+Math.random()*260,y:55+Math.random()*90};drawMini();save();beep()}};$('restart').onclick=()=>{score=0;save();$('score').textContent='0';star={x:160,y:95};drawMini()}}
function syncSpeed(){$('speedBtn').textContent=(speed===.5?'🐢':speed===1?'🐾':'⚡')+' '+speed+'×'}
$('speedBtn').onclick=()=>{speed=[.5,1,1.6][([.5,1,1.6].indexOf(speed)+1)%3];syncSpeed();save();toast('Velocidade: '+({'.5':'devagar','0.5':'devagar','1':'normal','1.6':'rápida'})[speed])};syncSpeed();
function makeup(){openPanel('💄 Maquiagem',`<p>Escolha as cores e veja na personagem!</p><div class="preview"><canvas id="beauty" width="240" height="190"></canvas></div><div class="row"><label>Batom <input type="color" id="lip" value="${avatar.lip||'#9d4e73'}"></label><label>Blush <input type="color" id="blush" value="${avatar.blush||'#f39eaf'}"></label><label>Sombra <input type="color" id="shadow" value="${avatar.shadow||'#ac85d1'}"></label></div><button id="cleanMakeup">🧽 Tirar maquiagem</button><button id="beautyDone">💖 Pronto!</button>`);const preview=()=>{const c=$('beauty'),g=c.getContext('2d');g.clearRect(0,0,240,190);g.fillStyle=avatar.hair;g.beginPath();g.ellipse(120,90,63,78,0,0,7);g.fill();g.fillStyle=avatar.skin;g.beginPath();g.ellipse(120,95,52,64,0,0,7);g.fill();g.strokeStyle=avatar.shadow||'#ac85d100';g.lineWidth=8;g.beginPath();g.moveTo(90,84);g.lineTo(108,84);g.moveTo(132,84);g.lineTo(150,84);g.stroke();g.fillStyle='#413249';for(const x of [99,141]){g.beginPath();g.ellipse(x,94,6,9,0,0,7);g.fill()}g.fillStyle=avatar.blush||'#f39eaf88';for(const x of [82,158]){g.beginPath();g.ellipse(x,117,10,6,0,0,7);g.fill()}g.strokeStyle=avatar.lip||'#9d4e73';g.lineWidth=5;g.beginPath();g.arc(120,122,12,0,Math.PI);g.stroke()};for(const k of ['lip','blush','shadow'])$(k).oninput=()=>{avatar[k]=$(k).value;save();preview()};$('cleanMakeup').onclick=()=>{delete avatar.lip;delete avatar.blush;delete avatar.shadow;save();makeup()};$('beautyDone').onclick=()=>{closePanel();toast('Visual pronto! 💖')};preview()}
function calendar(){const today=new Date(),year=today.getFullYear(),month=today.getMonth();openPanel('📅 Calendário',`<h3>${today.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3><div class="calendar">${['D','S','T','Q','Q','S','S'].map(x=>'<b>'+x+'</b>').join('')}${'<span></span>'.repeat(new Date(year,month,1).getDay())}${Array.from({length:new Date(year,month+1,0).getDate()},(_,i)=>`<button data-day="${i+1}" ${i+1===today.getDate()?'class="today"':''}>${i+1}</button>`).join('')}</div><div class="card"><b id="dayTitle"></b><textarea id="dayNote" maxlength="500" placeholder="O que vamos fazer neste dia?"></textarea><button id="saveDay">💾 Guardar compromisso</button></div>`);let day=today.getDate();const key=()=>`mb_agenda_${year}_${month}_${day}`;const select=()=>{$('dayTitle').textContent=day+'/'+(month+1)+'/'+year;try{$('dayNote').value=localStorage.getItem(key())||''}catch(e){}};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;select()});$('saveDay').onclick=()=>{try{localStorage.setItem(key(),$('dayNote').value);toast('Compromisso salvo! 📅')}catch(e){toast('Não foi possível guardar')}};select()}
toast('Bem-vinda ao Mundo Brilhante Village! Toque nas casas 🏡');})();
</script></body></html>
