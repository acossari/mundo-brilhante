count*iw)/(count+1);r.items.forEach((it,i)=>{const x=gap+(iw+gap)*i,y=H*.43;box(x,y,iw,Math.min(100,H*.17),'#ffffffb8',9);text(it[0],x+iw/2,y+49,Math.min(35,iw*.44));text(it[1],x+iw/2,y+70,Math.min(12,iw/7));addSpot(x,y,iw,105,it[1],()=>interactItem(it))});character(W*pos.x,H*.83,Math.min(1,W/410),anim>0);rect(W*.02,H*.2,80,42,'#ffffffcf',10);text('🚪 Sair',W*.02+40,H*.2+27,15);addSpot(W*.02,H*.2,80,42,'Sair',()=>exitRoom());text('Toque nos objetos • toque em uma porta para abrir',W/2,H*.69,Math.min(12,W/32),'#6e5076')}function draw(){frame++;spots=[];if(scene==='street')streetDraw();else roomDraw();if(anim>0)anim--;requestAnimationFrame(draw)}requestAnimationFrame(draw);function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}function enter(id){scene='room';room=id;pos={x:.5,y:.8};held='';toast('Você entrou em '+roomData[id].title+'! 🚪');updateActions()}function exitRoom(){scene='street';pos={x:.5,y:.77};held='';updateActions();toast('De volta à Village! 🏘️')}function interactItem(it){const [icon,name,kind]=it;if(kind==='porta'){openPanel('🚪 '+name,`<p>Você abriu a porta de <b>${name}</b>!</p><div class="card">✨ Um novo cantinho para brincar!</div><button id="doorPlay">Explorar e voltar</button>`);$('doorPlay').onclick=()=>{closePanel();toast('Você explorou '+name+'!')};return}if(kind==='pegar'){held=icon;inventory.push(name);save();toast('Você pegou '+name+' '+icon)}else if(kind==='sentar'){anim=80;toast('A personagem se sentou! 🪑')}else if(kind==='ligar'){toast(name+' ligado! 🔊');beep()}else{anim=80;toast('Hora de brincar! '+icon);beep()}}function updateActions(){const a=$('insideActions');a.innerHTML=scene==='room'?'<button id="leave">🚪 Sair da casa</button><button id="bag">🎒 Mochila</button><button id="drop">✋ Soltar</button>':'<button id="next">➡️ Outra rua</button><button id="drive">🚗 Carro</button>';if(scene==='room'){$('leave').onclick=exitRoom;$('ba ntListener('pointerup',e=>{if(modalOpen)return;let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(let i=spots.length-1;i>=0;i--){let s=spots[i];if(x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h){s.fn();return}}if(y>H*.65&&y<H*.9){pos.x=Math.max(.1,Math.min(.9,x/W));anim=25}});addEventListener('keydown',e=>{if(modalOpen)return;const m={ArrowLeft:[-.04,0],ArrowRight:[.04,0],ArrowUp:[0,-.03],ArrowDown:[0,.03]};if(m[e.key]){e.preventDefault();moveStep(...m[e.key])}});$('mapBtn').onclick=()=>openPanel('🗺️ Mapa da Village',`<p>Escolha um lugar para visitar!</p><div class="appgrid">${places.map(p=>`<button data-place="${p.id}">${p.icon}<br>${p.name}</button>`).join('')}</div><p class="mini">Você também pode tocar nas portas dos prédios da cidade.</p>`);$('modal').addEventListener('click',e=>{const id=e.target.closest('[data-place]')?.dataset.place;if(id){closePanel();enter(id)}});function choice(title,key,values){return `<div class="card"><b>${title}</b><div class="choices">${values.map(v=>`<button data-key="${key}" data-val="${v[0]}" style="${v[1]?.startsWith('#')?'background:'+v[1]:''}">${v[1]?.startsWith('#')?'● '+v[0]:v[1]||v[0]}</button>`).join('')}</div></div>`}function dress(){openPanel('👗 Criador de personagem',`<div class="preview"><canvas id="avatarPreview" width="200" height="200"></canvas></div>`+choice('Tom de pele','skin',[['clara','#f8d5b8'],['rosada','#eec3aa'],['morena','#d89a73'],['bronze','#a86a4a'],['escura','#704733']])+choice('Cabelo','hair',[['preto','#302631'],['castanho','#6e3d34'],['loiro','#e8b958'],['ruivo','#bd6046'],['rosa','#e68ac3'],['azul','#6497d7']])+choice('Penteado','style',[[0,'Solto'],[1,'Coquinhos'],[2,'Comprido'],[3,'Rabo de cavalo']])+choice('Roupas','dress',[[true,'Vestido'],[false,'Blusa + shorts']])+choice('Cor da roupa','outfit',[['Rosa','#d36da9'],['Azul','#7baddf'],['Amarelo','#efc95e'],['Verde','#86c6a2'],['Lilás','#a18ce0']])+choice('Shorts','pants',[['Lilás','#8455a9'],['Rosa','#de86a9'],['Azul','#648bc1'],['Preto','#454255']])+`<button id="saveDress">💾 Salvar personagem</button>`);drawPreview();document.querySelectorAll('[data-key]').forEach(b=>{b.onclick=()=>{let key=b.dataset.key,val=b.dataset.val;avatar[key]=key==='style'?+val:key==='dress'?val==='true':key==='skin'||key==='hair'||key==='outfit'||key==='pants'?({clara:'#f8d5b8',rosada:'#eec3aa',morena:'#d89a73',bronze:'#a86a4a',escura:'#704733',preto:'#302631',castanho:'#6e3d34',loiro:'#e8b958',ruivo:'#bd6046',rosa:key==='hair'?'#e68ac3':'#d36da9',azul:key==='hair'?'#6497d7':'#7baddf',amarelo:'#efc95e',verde:'#86c6a2','lilás':'#a18ce0',lilás:'#8455a9',preto2:'#454255'})[val]||val:val;save();drawPreview()}});$('saveDress').onclick=()=>{save();closePanel();toast('Personagem salva! 💖')}}function drawPreview(){let p=$('avatarPreview');if(!p)return;let old=ctx;const pc=p.getContext('2d');pc.clearRect(0,0,200,200);const prevW=W,prevH=H;ctx.save();ctx.setTransform(1,0,0,1,0,0);const original=window.__previewUnused; // preview is drawn with same canvas primitives using temporary context

g').value.trim();if(!v)return;messages.push({from:'Você',text:v},{from:'Luna',text:['Que legal! 💕','Vamos brincar na Village? 🏡','Amei! ✨','Vamos gravar uma dança? 💃'][messages.length%4]});save();$('msg').value='';render();beep()};$('msg').onkeydown=e=>{if(e.key==='Enter')$('send').click()}}else if(i===1){openPanel('🎵 MiniTok — vídeos do jogo',`<div class="card" style="text-align:center"><div id="vid" style="font-size:72px;height:125px;padding:15px">💃🎶</div><b>Vídeos animados da Village</b><p id="vidname">Dancinha da Luna</p><div class="row"><button id="watch">▶ Próximo vídeo</button><button id="like">💗 Curtir (${likes})</button><button id="post">🎥 Gravar dança (${posts})</button></div></div><p class="mini">Os vídeos são animações de brincadeira, não vídeos enviados por pessoas reais.</p>`);let n=0;const vs=['💃🎶','🕺✨','🎤🎵','👯‍♀️💖'];$('watch').onclick=()=>{n++;$('vid').textContent=vs[n%vs.length];$('vidname').textContent=['Dancinha da Luna','Dança da Estrela','Show na escola','Amigas dançando'][n%4];beep()};$('like').onclick=()=>{likes++;save();$('like').textContent='💗 Curtir ('+likes+')'};$('post').onclick=()=>{posts++;save();toast('Dancinha salva no MiniTok! 🎥');$('post').textContent='🎥 Gravar dança ('+posts+')'}}else if(i===2){weatherApp()}else if(i===3){gamesApp()}else if(i===4){openPanel('📷 Câmera',`<div class="card" style="text-align:center"><div style="font-size:65px">📸 👧 🌈</div><p>Fotografe sua personagem!</p><button id="snap">📸 Tirar foto</button></div><div id="gallery"></div>`);$('snap').onclick=()=>{const x=document.createElement('div');x.className='shot';x.textContent='📸 Foto da Village '+new Date().toLocaleTimeString('pt-BR');$('gallery').prepend(x);beep()}}else if(i===5){openPanel('🎨 Desenho',`<p>Desenhe com o dedo!</p><canvas id="paint" width="320" height="240" style="width:100%;max-width:450px;background:white;border:2px solid #dda5e8;border-radius:15px;touch-action:none"></canvas><div class="row"><input type="color" id="paintColor" value="#c868bc"><button id="erase">🧽 Limpar</button></div>`);let c=$('paint'),g=c.getContext('2d'),down=false;const pt=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let [x,y]=pt(e);g.beginPath();g.moveTo(x,y)};c.onpointermove=e=>{if(!down)return;let[x,y]=pt(e);g.strokeStyle=$('paintColor').value;g.lineWidth=5;g.lineCap='round';g.lineTo(x,y);g.stroke()};c.onpointerup=()=>down=false;$('erase').onclick=()=>g.clearRect(0,0,c.width,c.height)}else if(i===6){dress()}else if(i===7){openPanel('🎶 Música',`<p>Toque nas notas para ouvir!</p><div class="row">${['Dó','Ré','Mi','Fá','Sol','Lá','Si'].map((x,j)=>`<button data-note="${j}">🎹 ${x}</button>`).join('')}</div>`);document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=[261,293,329,349,392,440,493][+b.dataset.note];g.gain.value=.07;o.start();o.stop(a.currentTime+.3)}catch(e){}})}else if(i===8){openPanel('📔 Meu diário',`<p>Escreva sua história!</p><textarea id="diary" style="width:100%;height:180px;border-radius:12px;padding:10px"></textarea><button id="diarySave">💾 Guardar</button>`);$('diary').value=localStorage.getItem('mb_diary')||'';$('diarySave').onclick=()=>{localStorage.setItem('mb_diary',$('diary').value);toast('Diário salvo!')}}else if(i===9){$('mapBtn').click()}else if(i===10){openPanel('🛍️ Loja',`<p>Escolha um presente para a mochila:</p><div class="appgrid">${['🎀 Laço','🧸 Pelúcia','🎁 Presente','👜 Bolsa','👒 Chapéu','🍭 Pirulito'].map((x,j)=>`<button data-gift="${j}">${x}</button>`).join('')}</div>`);document.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{inventory.push(b.textContent.trim());save();toast('Presente guardado! 🎁')})}else{openPanel('📅 Agenda',`<div class="card"><b>Hoje na Village</b><p>🌞 Passear pela cidade</p><p>🎂 Visitar o Café Doce</p><p>💃 Dançar no estúdio</p><p>🧸 Decorar e brincar em casa</p></div>`)}}function weatherApp(){let opts=[['☀️','Ensolarado','#ffdb89'],['🌧️','Chuvoso','#bed8f6'],['⛅','Nublado','#e6e8f2'],['🌈','Arco-íris','#d3f3d5']];openPanel('🌤️ Clima da Village',`<div class="card" style="text-align:center;background:${opts[weather][2]}"><div style="font-size:75px" id="weatherIcon">${opts[weather][0]}</div><h2 id="weatherName">${opts[weather][1]}</h2><p>Previsão imaginária do nosso jogo</p></div><div class="row">${opts.map((o,j)=>`<button data-weather="${j}">${o[0]} ${o[1]}</button>`).join('')}</div><p>Escolha o clima para brincar de imaginar como está o dia!</p>`);document.querySelectorAll('[data-weather]').forEach(b=>b.onclick=()=>{weather=+b.dataset.weather;$('weatherIcon').textContent=opts[weather][0];$('weatherName').textContent=opts[weather][1];beep()})}function gamesApp(){openPanel('🎮 Jogos — Pegue as estrelas',`<p>Toque nas estrelas antes que mudem de lugar!</p><div class="card">⭐ Pontos: <b id="score">${score}</b> <button id="restart">Recomeçar</button></div><canvas id="gameapp" width="330" height="200"></canvas>`);const c=$('gameapp'),g=c.getContext('2d');let star={x:160,y:95};function drawMini(){g.fillStyle='#d8f7ff';g.fillRect(0,0,330,200);g.fillStyle='#8fdbab';g.fillRect(0,150,330,50);g.font='48px system-ui';g.textAlign='center';g.fillText('⭐',star.x,star.y)}drawMini();c.onpointerdown=e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*330/r.width,y=(e.clientY-r.top)*200/r.height;if(Math.abs(x-star.x)<40&&Math.abs(y-(star.y-20))<42){score++;$('score').textContent=score;star={x:35+Math.random()*260,y:55+Math.random()*90};drawMini();save();beep()}};$('restart').onclick=()=>{score=0;save();$('score').textContent='0';star={x:160,y:95};drawMini()}}toast('Bem-vinda ao Mundo Brilhante Village! Toque nas casas 🏡');})();
